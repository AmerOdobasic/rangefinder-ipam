{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<h1>Log in</h1>
<form method="post">
  <label>Username <input name="username" required autofocus></label>
  <label>Password <input name="password" type="password" required></label>
  <button type="submit">Log in</button>
</form>
{% if config.DEBUG %}
  <p>Dev shortcuts:</p>
  <ul>
    <li><a href="/dev-login/admin">Network Administrator</a></li>
    <li><a href="/dev-login/engineer">Systems Engineer</a></li>
    <li><a href="/dev-login/auditor">Read-Only Auditor</a></li>
  </ul>
{% endif %}
{% endblock %}
